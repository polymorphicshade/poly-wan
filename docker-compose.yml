# poly-wan on an NVIDIA GPU, over plain HTTP.
#
#   cp .env.example .env      # optional: port, variant, serve flags, ...
#   docker compose up -d --build
#   http://<host>:7860
#
# For HTTPS, use docker-compose.https.yml instead.

services:
  app:
    build: .
    image: poly-wan:latest
    restart: unless-stopped
    ports:
      - "${PORT:-7860}:7860"
    environment:
      WAN_VIDEO_VARIANT: ${WAN_VIDEO_VARIANT:-vace-1.3b}
      WAN_VIDEO_SERVE_ARGS: ${WAN_VIDEO_SERVE_ARGS:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/data/cache
      - outputs:/data/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:      # model weights (~17-90 GB per variant, depending on the variants used)
  outputs:     # generated videos
