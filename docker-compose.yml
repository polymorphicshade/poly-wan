# poly-wan behind Caddy, which serves it over HTTPS with its own certificate.
#
#   cp .env.example .env      # set DOMAIN (and optionally the variant, auth, ...)
#   docker compose up -d --build
#
# Caddy gets a Let's Encrypt certificate for a public DOMAIN automatically (ports 80 and 443 must
# reach this host), or issues one from its own local CA for localhost, IP addresses and LAN-only
# names. The app itself is not published on any host port; only Caddy is.

services:
  app:
    build: .
    image: poly-wan:latest
    restart: unless-stopped
    environment:
      WAN_VIDEO_VARIANT: ${WAN_VIDEO_VARIANT:-vace-1.3b}
      WAN_VIDEO_SERVE_ARGS: ${WAN_VIDEO_SERVE_ARGS:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/data/cache
      - outputs:/data/outputs
    expose:
      - "7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/conf.d:/etc/caddy/conf.d:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  models:      # model weights (~17-90 GB per variant, depending on the variants used)
  outputs:     # generated videos
  caddy_data:  # certificates and keys: keep it, or Let's Encrypt rate limits may bite
  caddy_config:
